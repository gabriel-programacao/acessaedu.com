<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcessaEdu | Terminal de Frequência</title>
    
    <link rel="icon" type="image/png" href="Icone_acessaedu.ico">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --pe-blue: #003399; --pe-yellow: #ffcc00; --pe-green: #10b981; --pe-red: #cc0000; }
        body { background: linear-gradient(135deg, var(--pe-blue) 0%, #001a4d 100%); color: white; font-family: 'Poppins', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; }
        .terminal-container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border-radius: 40px; padding: 40px; border: 1px solid rgba(255, 255, 255, 0.2); width: 90%; max-width: 650px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        .logo-terminal { background: rgba(255, 255, 255, 0.15); padding: 15px; border-radius: 20px; margin-bottom: 25px; }
        video { width: 100%; border-radius: 25px; border: 5px solid white; transform: scaleX(-1); box-shadow: 0 15px 35px rgba(0,0,0,0.4); background: #000; }
        .feedback-area { margin-top: 30px; min-height: 140px; transition: 0.5s; position: relative; }
        .card-aluno { background: var(--pe-green); color: white; padding: 20px; border-radius: 25px; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .card-bloqueio { background: var(--pe-red); color: white; padding: 20px; border-radius: 25px; animation: shake 0.5s ease-in-out; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .fila-badge { position: absolute; bottom: -20px; right: 0; font-size: 0.7rem; opacity: 0.8; background: rgba(0,0,0,0.3); padding: 2px 10px; border-radius: 10px; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .btn-voltar { position: fixed; top: 20px; left: 20px; background: rgba(255,255,255,0.2); color: white; border-radius: 30px; padding: 8px 20px; text-decoration: none; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.3); transition: 0.3s; z-index: 100; }
        .btn-voltar:hover { background: white; color: var(--pe-blue); }
        @keyframes popIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; scale(1); } }
        .loader { border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <a href="dashboard.html" class="btn-voltar"><i class="fas fa-arrow-left me-2"></i> Voltar</a>

    <div class="terminal-container">
        <div class="logo-terminal"><img src="logo_acessaedu.png" alt="AcessaEdu" class="img-fluid" style="max-height: 70px;"></div>
        <video id="video" autoplay muted playsinline></video>
        <div class="feedback-area" id="display">
            <div id="loading"><div class="loader mb-2"></div><p class="small">Iniciando Terminal Inteligente...</p></div>
            <p class="fs-4 fw-bold mt-3" style="opacity: 0.8;">Aguardando identificação...</p>
            <div id="status-fila" class="fila-badge"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, getDoc, doc, addDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDgR98RtL8sgxVbEV2Swyb2wnHLSPt3cDo", 
            authDomain: "escolapro-15e5e.firebaseapp.com", 
            projectId: "escolapro-15e5e", 
            storageBucket: "escolapro-15e5e.firebasestorage.app", 
            messagingSenderId: "339019791514", 
            appId: "1:339019791514:web:44e0d58b6835f0fe6df323" 
        };

        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const logado = JSON.parse(localStorage.getItem('usuarioLogado'));
        let ultimoNomeDetectado = ""; 
        let tempoUltimaDeteccao = 0;
        let isProcessing = false;
        let configEscola = null;

        // FILA DE PROCESSAMENTO SEQUENCIAL
        let filaDeEnvio = Promise.resolve();

        onAuthStateChanged(auth, (user) => {
            if (user) carregarConfiguracoes();
            else window.location.href = 'index.html';
        });

        async function carregarConfiguracoes() {
            if(!logado) return;
            try {
                const docRef = doc(db, "unidades", logado.escolaId);
                const snap = await getDoc(docRef);
                if(snap.exists()) {
                    configEscola = snap.data();
                    initTerminal();
                    processarFilaEsquecida(); // Recupera pendentes após atualizar página
                }
            } catch (e) { console.error(e); }
        }

        async function initTerminal() {
            try {
                const URL_MODELS = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
                await faceapi.nets.tinyFaceDetector.loadFromUri(URL_MODELS);
                await faceapi.nets.faceLandmark68Net.loadFromUri(URL_MODELS);
                await faceapi.nets.faceRecognitionNet.loadFromUri(URL_MODELS);

                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('video').srcObject = stream;
                
                const snap = await getDocs(query(collection(db, "alunos"), where("escolaId", "==", logado.escolaId)));
                const mapaAlunos = {};
                const labledDescriptors = [];

                snap.forEach(d => {
                    const data = d.data();
                    if(data.descritor) {
                        mapaAlunos[data.nome] = { sala: data.sala || "Sem Turma", telResp: data.tel || "" };
                        labledDescriptors.push(new faceapi.LabeledFaceDescriptors(data.nome, [new Float32Array(data.descritor)]));
                    }
                });

                if(labledDescriptors.length === 0) {
                    document.getElementById('display').innerHTML = "<p class='text-warning'>Nenhum rosto cadastrado nesta unidade.</p>";
                    return;
                }

                const faceMatcher = new faceapi.FaceMatcher(labledDescriptors, 0.55);
                document.getElementById('loading').style.display = 'none';
                
                setInterval(async () => {
                    if(isProcessing) return;

                    const video = document.getElementById('video');
                    const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                    
                    if(detection) {
                        const match = faceMatcher.findBestMatch(detection.descriptor);
                        const agora = Date.now();

                        if(match.label !== 'unknown') {
                            const nome = match.label;
                            if(nome === ultimoNomeDetectado && (agora - tempoUltimaDeteccao) < 10000) return;

                            isProcessing = true;
                            const info = mapaAlunos[nome];
                            const hoje = new Date().toLocaleDateString('pt-BR');
                            const dataObj = new Date();
                            const hora = dataObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                            const qPresenca = query(
                                collection(db, "frequencia"), 
                                where("nome", "==", nome), 
                                where("data", "==", hoje),
                                where("escolaId", "==", logado.escolaId)
                            );
                            const presencaSnap = await getDocs(qPresenca);

                            if (!presencaSnap.empty) {
                                document.getElementById('display').innerHTML = `
                                    <div class="card-bloqueio">
                                        <h2 class="fw-bold mb-1">JÁ REGISTRADO</h2>
                                        <p class="mb-0">${nome.toUpperCase()}</p>
                                    </div>`;
                                setTimeout(() => { resetDisplay(); }, 2000); // Reset mais rápido
                                return;
                            }

                            document.getElementById('display').innerHTML = `
                                <div class="card-aluno">
                                    <h2 class="fw-bold mb-1">BEM-VINDO(A)</h2>
                                    <p class="mb-0">${nome.toUpperCase()}</p>
                                    <small class="d-block mt-2" id="msg-status">Sincronizando presença...</small>
                                </div>`;

                            await addDoc(collection(db, "frequencia"), { 
                                nome, 
                                sala: info.sala, 
                                escolaId: logado.escolaId, 
                                data: hoje, 
                                hora, 
                                dataHora: serverTimestamp() 
                            });

                            if (configEscola && configEscola.mensagensAtivas && info.telResp) {
                                agendarNotificacao(info.telResp, nome, hora);
                            } else {
                                const el = document.getElementById('msg-status');
                                if(el) el.innerText = "Presença confirmada! ✅";
                            }

                            ultimoNomeDetectado = nome;
                            tempoUltimaDeteccao = agora;
                            setTimeout(() => { resetDisplay(); }, 2000); // Libera câmera em 2s
                        }
                    }
                }, 400); // Leitura rápida
            } catch (err) { console.error(err); isProcessing = false; }
        }

        // SALVA NA CAIXA DE SAIDA LOCAL PARA NÃO PERDER SE A PÁGINA FECHAR
        function agendarNotificacao(tel, nome, hora) {
            let filaLocal = JSON.parse(localStorage.getItem('caixa_saida_acessaedu') || "[]");
            const novaTarefa = { id: Date.now() + Math.random(), tel, nome, hora };
            filaLocal.push(novaTarefa);
            localStorage.setItem('caixa_saida_acessaedu', JSON.stringify(filaLocal));
            
            atualizarStatusFilaVisual();
            filaDeEnvio = filaDeEnvio.then(() => executarEnvio(novaTarefa));
        }

        async function processarFilaEsquecida() {
            let filaLocal = JSON.parse(localStorage.getItem('caixa_saida_acessaedu') || "[]");
            filaLocal.forEach(tarefa => {
                filaDeEnvio = filaDeEnvio.then(() => executarEnvio(tarefa));
            });
        }

        async function executarEnvio(tarefa) {
            // OS 10 TEMPOS DIFERENTES CONFORME SOLICITADO
            const tempos = [3, 5, 8, 12, 15, 20, 2, 4, 10, 18]; 
            const delay = tempos[Math.floor(Math.random() * tempos.length)];
            
            console.log(`Fila: ${tarefa.nome} aguardando ${delay}s...`);
            await new Promise(res => setTimeout(res, delay * 1000));

            const sucesso = await enviarNotificacaoZAPI(tarefa.tel, tarefa.nome, tarefa.hora);
            
            if(sucesso) {
                let filaLocal = JSON.parse(localStorage.getItem('caixa_saida_acessaedu') || "[]");
                filaLocal = filaLocal.filter(t => t.id !== tarefa.id);
                localStorage.setItem('caixa_saida_acessaedu', JSON.stringify(filaLocal));
                atualizarStatusFilaVisual();
            }
        }

        function atualizarStatusFilaVisual() {
            let filaLocal = JSON.parse(localStorage.getItem('caixa_saida_acessaedu') || "[]");
            const el = document.getElementById('status-fila');
            if(el) el.innerText = filaLocal.length > 0 ? `📦 Caixa de saída: ${filaLocal.length} pendentes` : "";
        }

        function resetDisplay() {
            const display = document.getElementById('display');
            if(display) {
                display.innerHTML = `<p class="fs-4 fw-bold mt-3" style="opacity: 0.8;">Aguardando identificação...</p><div id="status-fila" class="fila-badge"></div>`; 
                atualizarStatusFilaVisual();
            }
            isProcessing = false;
        }

        async function enviarNotificacaoZAPI(telefone, alunoNome, hora) {
            if (!configEscola.zapiApi || !configEscola.zapiInstance) return false;

            // VARIÁVEIS DE HUMANIZAÇÃO (SAUDAÇÕES E FRASES ALEATÓRIAS)
            const horaAtualNum = new Date().getHours();
            let saudacaoHorario = (horaAtualNum < 12) ? "Bom dia!" : (horaAtualNum < 18) ? "Boa tarde!" : "Boa noite!";
            
            const saudacoesExtra = ["Olá!", "Tudo bem?", "Oi!", "Olá, tudo certo?", "Atenção:", "Informativo Escolar:"];
            const s = [saudacaoHorario, saudacoesExtra[Math.floor(Math.random() * saudacoesExtra.length)]][Math.floor(Math.random()*2)];

            const corpos = [
                `confirmamos que *${alunoNome.toUpperCase()}* registrou entrada na instituição *${configEscola.nome}*.`,
                `informamos que o(a) aluno(a) *${alunoNome.toUpperCase()}* já se encontra na instituição *${configEscola.nome}*.`,
                `registro de entrada realizado para *${alunoNome.toUpperCase()}* na unidade *${configEscola.nome}*.`,
                `acesso confirmado para *${alunoNome.toUpperCase()}* na instituição *${configEscola.nome}*.`,
                `notificamos a entrada de *${alunoNome.toUpperCase()}* na escola *${configEscola.nome}*.`
            ];

            const interacoes = [
                "Por favor, responda com um *'OK'* para confirmarmos o recebimento.",
                "Pode nos dar um retorno com um *'SIM'* por favor?",
                "Se puder, nos confirme com um *'RECEBIDO'* por gentileza.",
                "Tudo certo com o horário? Responda com um *'OK'*."
            ];

            const rodapes = [
                "📌 Salve nosso contato para garantir o recebimento dos avisos.",
                "💡 Adicione este número à sua agenda para evitar o spam.",
                "🤝 Escola e família conectadas. Salve nosso contato!",
                "✅ Notificação automática gerada pelo sistema *AcessaEdu*."
            ];

            const c = corpos[Math.floor(Math.random() * corpos.length)];
            const i = interacoes[Math.floor(Math.random() * interacoes.length)];
            const r = rodapes[Math.floor(Math.random() * rodapes.length)];
            const hash = Math.random().toString(36).substring(7).toUpperCase();

            // MONTAGEM FINAL DO TEXTO CONFORME O PADRÃO SOLICITADO
            const mensagem = `*AcessaEdu | Notificação Escolar* 🏫\n\n` +
                             `${s} ${c}\n\n` +
                             `📅 *Data:* ${new Date().toLocaleDateString('pt-BR')}\n` +
                             `⏰ *Hora:* ${hora}\n\n` +
                             `${i}\n\n` +
                             `${r}\n` +
                             `_Reg: ${hash}_`;

            try {
                let apiBase = configEscola.zapiApi.trim().split('/instances')[0].replace(/\/+$/, "");
                const endpoint = `${apiBase}/instances/${configEscola.zapiInstance}/token/${configEscola.zapiToken}/send-text`;
                let num = telefone.replace(/\D/g, ''); if (num.length === 11) num = num.substring(0, 2) + num.substring(3);

                const res = await fetch(endpoint, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json', 'Client-Token': configEscola.zapiSecurity || '' }, 
                    body: JSON.stringify({ phone: "55" + num, message: mensagem, delayMessage: 5, delayTyping: 3 }) 
                });
                return res.ok;
            } catch (e) { return false; }
        }
    </script>
</body>
</html>
