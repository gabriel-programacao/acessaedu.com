<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcessaEdu | Terminal de Frequência</title>
    
    <link rel="icon" type="image/png" href="Icone_acessaedu.ico">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --pe-blue: #003399; --pe-yellow: #ffcc00; --pe-green: #10b981; --pe-red: #cc0000; }
        body { background: linear-gradient(135deg, var(--pe-blue) 0%, #001a4d 100%); color: white; font-family: 'Poppins', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; }
        .terminal-container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border-radius: 40px; padding: 40px; border: 1px solid rgba(255, 255, 255, 0.2); width: 95%; max-width: 700px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.3); position: relative; }
        .video-wrapper { position: relative; width: 100%; border-radius: 25px; overflow: hidden; border: 5px solid white; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        video { width: 100%; transform: scaleX(-1); background: #000; display: block; }
        .face-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 10; }
        .face-cutout { width: 250px; height: 320px; border: 4px dashed rgba(255, 255, 255, 0.5); border-radius: 120px; box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5); position: relative; transition: 0.3s; }
        .face-cutout.detected { border-color: var(--pe-green); border-style: solid; box-shadow: 0 0 0 1000px rgba(16, 185, 129, 0.2); }
        .scan-line { position: absolute; width: 100%; height: 4px; background: rgba(255, 255, 255, 0.5); top: 0; animation: scanning 3s linear infinite; }
        @keyframes scanning { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
        .feedback-area { margin-top: 20px; min-height: 120px; }
        .card-aluno { background: var(--pe-green); color: white; padding: 15px; border-radius: 20px; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card-atraso { background: var(--pe-yellow); color: var(--pe-blue); padding: 15px; border-radius: 20px; animation: popIn 0.5s ease; }
        .card-bloqueio { background: var(--pe-red); color: white; padding: 15px; border-radius: 20px; animation: shake 0.5s ease-in-out; }
        .btn-voltar { position: fixed; top: 20px; left: 20px; background: rgba(255,255,255,0.2); color: white; border-radius: 30px; padding: 8px 20px; text-decoration: none; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.3); z-index: 100; }
        
        /* ESTILO DO CONTADOR DISCRETO EM BAIXO */
        .badge-fila { position: fixed; bottom: 20px; right: 20px; background: rgba(0, 0, 0, 0.6); color: #fff; padding: 6px 14px; border-radius: 15px; font-size: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.1); font-weight: 400; display: none; backdrop-filter: blur(5px); z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        @keyframes popIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    </style>
</head>
<body>

    <a href="dashboard.html" class="btn-voltar"><i class="fas fa-arrow-left me-2"></i> Voltar</a>

    <div class="terminal-container">
        <div class="logo-terminal mb-3"><img src="logo_acessaedu.png" alt="AcessaEdu" style="max-height: 60px;"></div>
        <div class="video-wrapper">
            <video id="video" autoplay muted playsinline></video>
            <div class="face-overlay">
                <div class="face-cutout" id="moldura"><div class="scan-line"></div></div>
            </div>
        </div>
        <div class="feedback-area" id="display">
            <p class="fs-5 fw-bold mt-3" id="instrucao">Posicione o rosto na moldura</p>
        </div>
    </div>

    <div id="statusFila" class="badge-fila"><i class="fas fa-paper-plane me-2 text-warning"></i> Envio pendente: <span id="contadorFila" class="fw-bold">0</span></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, getDoc, doc, addDoc, updateDoc, query, where, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // CONFIGURAÇÃO ORIGINAL MANUTENIDA INTEGRA
        const firebaseConfig = { apiKey: "AIzaSyDgR98RtL8sgxVbEV2Swyb2wnHLSPt3cDo", authDomain: "escolapro-15e5e.firebaseapp.com", projectId: "escolapro-15e5e", storageBucket: "escolapro-15e5e.firebasestorage.app", messagingSenderId: "339019791514", appId: "1:339019791514:web:44e0d58b6835f0fe6df323" };
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const logado = JSON.parse(localStorage.getItem('usuarioLogado'));
        let ultimoNomeDetectado = ""; 
        let tempoUltimaDeteccao = 0;
        let isProcessing = false;
        let configEscola = null;
        let ultimoDelayUtilizado = null;

        // IDENTIFICADOR ÚNICO DO HARDWARE E CONTROLE DE ESTEIRA
        const terminalId = "TERM_" + Math.random().toString(36).substring(2, 9).toUpperCase();
        let loopFilaAtivo = false;
        let totalPendentesNoBanco = 0;

        onAuthStateChanged(auth, (user) => {
            if (user) carregarConfiguracoes();
            else window.location.href = 'index.html';
        });

        async function carregarConfiguracoes() {
            if(!logado) return;
            try {
                const docRef = doc(db, "unidades", logado.escolaId);
                const snap = await getDoc(docRef);
                if(snap.exists()) {
                    configEscola = snap.data();
                    initTerminal();

                    if (!loopFilaAtivo) {
                        loopFilaAtivo = true;
                        processarFilaDoBanco();
                    }
                }
            } catch (e) { console.error(e); }
        }

        async function initTerminal() {
            try {
                const URL_MODELS = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
                await faceapi.nets.tinyFaceDetector.loadFromUri(URL_MODELS);
                await faceapi.nets.faceLandmark68Net.loadFromUri(URL_MODELS);
                await faceapi.nets.faceRecognitionNet.loadFromUri(URL_MODELS);
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('video').srcObject = stream;
                
                const snap = await getDocs(query(collection(db, "alunos"), where("escolaId", "==", logado.escolaId)));
                const mapaAlunos = {};
                const labledDescriptors = [];
                
                snap.forEach(d => {
                    const data = d.data();
                    if(data.descritor) {
                        mapaAlunos[data.nome] = { sala: data.sala || "Sem Turma", telResp: data.tel || "" };
                        labledDescriptors.push(new faceapi.LabeledFaceDescriptors(data.nome, [new Float32Array(data.descritor)]));
                    }
                });

                // MANTIDO RIGOROSAMENTE EM 0.45 CONFORME EXIGIDO
                const faceMatcher = new faceapi.FaceMatcher(labledDescriptors, 0.45); 

                setInterval(async () => {
                    if(isProcessing) return;
                    const video = document.getElementById('video');
                    const molduraEl = document.getElementById('moldura');
                    
                    const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                    
                    if(detection) {
                        const box = detection.detection.box;
                        const vW = video.videoWidth; 
                        const vH = video.videoHeight;
                        const faceCenterX = box.x + (box.width / 2);
                        const faceCenterY = box.y + (box.height / 2);
                        
                        const enquadradoH = faceCenterX > (vW * 0.30) && faceCenterX < (vW * 0.70);
                        const enquadradoV = faceCenterY > (vH * 0.25) && faceCenterY < (vH * 0.75);
                        const tamanhoCerto = box.height > (vH * 0.35);

                        if (enquadradoH && enquadradoV && tamanhoCerto) {
                            molduraEl.classList.add('detected');
                            const match = faceMatcher.findBestMatch(detection.descriptor);
                            
                            if(match.label !== 'unknown') {
                                const nome = match.label;
                                const agora = Date.now();
                                if(nome === ultimoNomeDetectado && (agora - tempoUltimaDeteccao) < 30000) return;
                                isProcessing = true;
                                processarPresenca(nome, mapaAlunos[nome]);
                            } else {
                                isProcessing = true;
                                exibirNaoCadastrado();
                            }
                        } else { molduraEl.classList.remove('detected'); }
                    } else { molduraEl.classList.remove('detected'); }
                }, 600);
            } catch (err) { console.error(err); }
        }

        function exibirNaoCadastrado() {
            document.getElementById('display').innerHTML = `
                <div class="card-bloqueio" style="background: #6c757d;">
                    <h2>ALUNO NÃO CADASTRADO</h2>
                    <p>Rosto não reconhecido no sistema.</p>
                </div>`;
            setTimeout(resetDisplay, 3000);
        }

        async function processarPresenca(nome, info) {
            const agora = new Date();
            const hoje = agora.toLocaleDateString('pt-BR');
            const horaAtual = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            const [h, m] = horaAtual.split(':').map(Number);
            const totalMinutos = (h * 60) + m;
            const estaAtrasado = totalMinutos >= 466;

            const q = query(collection(db, "frequencia"), where("nome", "==", nome), where("data", "==", hoje), where("escolaId", "==", logado.escolaId));
            const snap = await getDocs(q);

            if (!snap.empty) {
                document.getElementById('display').innerHTML = `<div class="card-bloqueio"><h2>JÁ REGISTRADO</h2><p>${nome.toUpperCase()}</p></div>`;
            } else {
                await addDoc(collection(db, "frequencia"), { 
                    nome, sala: info.sala, escolaId: logado.escolaId, data: hoje, hora: horaAtual, dataHora: serverTimestamp(), atraso: estaAtrasado 
                });

                if (estaAtrasado) {
                    document.getElementById('display').innerHTML = `<div class="card-atraso"><h2>ENTRADA COM ATRASO</h2><p>${nome.toUpperCase()}<br>Horário: ${horaAtual}</p></div>`;
                    if (configEscola.mensagensAtivas && info.telResp) {
                        // ADICIONADO: Envia a tarefa para a fila persistente de background do Firestore
                        await addDoc(collection(db, "fila_whatsapp"), {
                            telefone: info.telResp,
                            alunoNome: nome,
                            hora: horaAtual,
                            escolaId: logado.escolaId,
                            status: "pendente",
                            terminalOrigem: terminalId,
                            dataCriacao: serverTimestamp()
                        });
                        await atualizarContadorVisualFila();
                    }
                } else {
                    document.getElementById('display').innerHTML = `<div class="card-aluno"><h2>BEM-VINDO(A)</h2><p>${nome.toUpperCase()}</p></div>`;
                }
            }
            ultimoNomeDetectado = nome; 
            tempoUltimaDeteccao = Date.now();
            setTimeout(resetDisplay, 3000);
        }

        async function atualizarContadorVisualFila() {
            try {
                const qContador = query(
                    collection(db, "fila_whatsapp"),
                    where("escolaId", "==", logado.escolaId),
                    where("status", "in", ["pendente", "enviando"])
                );
                const snap = await getDocs(qContador);
                totalPendentesNoBanco = snap.size;

                const painel = document.getElementById('statusFila');
                const contadorText = document.getElementById('contadorFila');

                if (totalPendentesNoBanco > 0) {
                    contadorText.innerText = totalPendentesNoBanco;
                    painel.style.display = "block";
                } else {
                    painel.style.display = "none";
                }
            } catch (e) { console.error(e); }
        }

        async function processarFilaDoBanco() {
            while (loopFilaAtivo) {
                if (!configEscola) {
                    await new Promise(r => setTimeout(r, 2000));
                    continue;
                }

                try {
                    await atualizarContadorVisualFila();

                    let qFila = query(
                        collection(db, "fila_whatsapp"), 
                        where("escolaId", "==", logado.escolaId),
                        where("status", "in", ["pendente", "enviando"]),
                        where("terminalOrigem", "==", terminalId),
                        orderBy("dataCriacao", "asc"),
                        limit(1)
                    );
                    
                    let snapshot = await getDocs(qFila);
                    
                    if (snapshot.empty) {
                        qFila = query(
                            collection(db, "fila_whatsapp"), 
                            where("escolaId", "==", logado.escolaId),
                            where("status", "in", ["pendente", "enviando"]),
                            orderBy("dataCriacao", "asc"),
                            limit(1)
                        );
                        snapshot = await getDocs(qFila);
                    }
                    
                    if (!snapshot.empty) {
                        const documentoFila = snapshot.docs[0];
                        const dadosTarefa = documentoFila.data();
                        const docRefTarefa = doc(db, "fila_whatsapp", documentoFila.id);
                        
                        await updateDoc(docRefTarefa, { 
                            status: "enviando",
                            terminalProcessador: terminalId
                        });
                        await atualizarContadorVisualFila();
                        
                        await executarEnvioZapi(dadosTarefa.telefone, dadosTarefa.alunoNome, dadosTarefa.hora);
                        
                        await updateDoc(docRefTarefa, { status: "concluido", dataEnvio: serverTimestamp() });
                    }
                } catch (error) {
                    console.error("Erro no processamento multi-terminal distribuído:", error);
                }
                
                await new Promise(r => setTimeout(r, 2000));
            }
        }

        function executarEnvioZapi(telefone, alunoNome, hora) {
            return new Promise(async (resolve) => {
                if (!configEscola.zapiApi || !configEscola.zapiInstance || !configEscola.zapiToken) {
                    resolve();
                    return;
                }

                const nomeU = alunoNome.toUpperCase();
                const escolaU = configEscola.nome.toUpperCase();
                const dataHoje = new Date().toLocaleDateString('pt-BR');
                const registroId = Math.random().toString(36).substring(7).toUpperCase();

                const saudacoes = ["*AcessaEdu | Notificação de Entrada*", "*Informativo Escolar Importante*", "*Comunicado de Frequência*", "Prezados Pais e Responsáveis,", "Olá! Notificamos que:", "*Alerta de Atraso Escolar*", "Saudações da coordenação escolar.", "Atenção: Registro de Entrada Tardia", "*AcessaEdu | Controle de Acesso*", "Aviso de Horário Escolar:"];

                const corpos = [
                    `Informamos que o(a) aluno(a) *${nomeU}* registrou sua entrada na unidade *${escolaU}* APÓS o horário permitido para o início das atividades escolares.\n\n📅 Data: ${dataHoje}\n⏰ Horário de Chegada: ${hora}`,
                    `Identificamos através do nosso sistema que *${nomeU}* chegou à escola hoje fora do horário estabelecido. Ressaltamos que a entrada ocorreu depois do limite de tolerância.\n\n📅 Registro em: ${dataHoje}\n⌚ Hora da entrada: ${hora}`,
                    `Notificamos que, na data de hoje, o(a) estudante *${nomeU}* acessou as dependências da instituição apresentando atraso no cumprimento do horário escolar.\n\n📅 Data do evento: ${dataHoje}\n⏰ Hora registrada: ${hora}`,
                    `Atenção: O sistema AcessaEdu acaba de detectar que *${nomeU}* ultrapassou o horário limite de entrada permitido para o bom andamento das aulas.\n\n📅 Data: ${dataHoje}\n⏰ Hora exata: ${hora}`,
                    `Informamos aos responsáveis que o registro de frequência de *${nomeU}* consta como tardio, tendo o(a) aluno(a) se apresentado após o sinal de início.\n\n📅 Data: ${dataHoje}\n⌚ Horário de chegada: ${hora}`,
                    `O(a) aluno(a) *${nomeU}* registrou entrada na escola *${escolaU}* com atraso verificado. É fundamental que o horário letivo seja respeitado para evitar prejuízos.\n\n📅 Data: ${dataHoje}\n⏰ Entrada às: ${hora}`,
                    `Comunicamos que, infelizmente, *${nomeU}* não conseguiu cumprir o horário regulamentar da unidade hoje, chegando após o início das aulas.\n\n📅 Data: ${dataHoje}\n⏰ Horário: ${hora}`,
                    `Este é um aviso automático para informar que *${nomeU}* deu entrada na instituição fora do período de pontualidade esperado pela equipe diretiva.\n\n📅 Dia: ${dataHoje}\n⌚ Horário de acesso: ${hora}`,
                    `Registramos que o(a) estudante *${nomeU}* apresentou-se para as atividades letivas hoje com atraso, marcando sua entrada no sistema após o horário oficial.\n\n📅 Data: ${dataHoje}\n⏰ Hora: ${hora}`,
                    `Saudações. Notificamos que o(a) aluno(a) *${nomeU}* chegou à unidade *${escolaU}* em um horário posterior ao permitido para o acesso pontual.\n\n📅 Data: ${dataHoje}\n⏰ Horário registrado: ${hora}`
                ];

                const fechamentos = ["Por favor, responda com *'OK'* se visualizou este informativo.", "Solicitamos que responda com *'CIENTE'* para validarmos a notificação.", "Pedimos que, por gentileza, responda com *'RECEBIDO'* para nosso controle.", "Se você visualizou este aviso, poderia confirmar escrevendo apenas *'OK'*?", "Sua confirmação é essencial para mantermos o registro. Responda com *'SIM'*.", "Pode confirmar o recebimento deste comunicado digitando *'OK'*?", "Contamos com sua colaboração para evitar atrasos rotineiros. Responda com *'OK'*.", "Responda a este alerta com *'CIENTE'* para que possamos registrar sua visualização.", "A parceria entre família e escola é vital. Por favor, responda com *'OK'*.", "Para validar este envio automático, pedimos que responda com *'RECEBIDO'*."];

                const s = saudacoes[Math.floor(Math.random() * saudacoes.length)];
                const c = corpos[Math.floor(Math.random() * corpos.length)];
                const f = fechamentos[Math.floor(Math.random() * fechamentos.length)];
                
                const msgFinal = `${s}\n\n${c}\n\n${f}\n\n*${escolaU}* sempre avançando, sempre junto!\n_Busca ativa junto da família._\n\n✅ Notificação AcessaEdu\n_Ref: ${registroId}_`;

                // MANTIDA A SUA LISTA EXATA DE TEMPOS ALEATÓRIOS
                const temposAleatorios = [5, 10, 15, 20, 21, 30, 35, 40, 43, 50, 55, 76, 32, 76, 45, 22, 25, 27, 29, 39, 36, 32, 64, 78, 80, 92, 13, 12, 4, 46, 39, 50, 34, 36, 65, 80, 56, 47, 52, 64, 31, 45, 8, 67];
                let delayEscolhido;
                
                do {
                    delayEscolhido = temposAleatorios[Math.floor(Math.random() * temposAleatorios.length)];
                } while (delayEscolhido === ultimoDelayUtilizado);
                
                ultimoDelayUtilizado = delayEscolhido; 

                let num = "55" + telefone.replace(/\D/g, '').replace(/^55/, '');
                if (num.length === 13) num = num.substring(0, 4) + num.substring(5);

                console.log(`[${terminalId}] Aguardando delay de segurança anti-ban para ${nomeU}: ${delayEscolhido}s...`);
                
                setTimeout(() => {
                    try {
                        let baseUrl = configEscola.zapiApi.trim();
                        if(baseUrl.includes('/instances/')) { baseUrl = baseUrl.split('/instances/')[0]; }
                        baseUrl = baseUrl.replace(/\/+$/, "");
                        const endpoint = `${baseUrl}/instances/${configEscola.zapiInstance}/token/${configEscola.zapiToken}/send-text`;
                        
                        fetch(endpoint, { 
                            method: 'POST', 
                            headers: { 'Content-Type': 'application/json', ...(configEscola.zapiSecurity && { 'Client-Token': configEscola.zapiSecurity }) }, 
                            body: JSON.stringify({ phone: num, message: msgFinal, delayMessage: 0, delayTyping: 4 }) 
                        }).then(r => {
                            console.log(`[${terminalId}] Notificação enviada para o aluno ${nomeU}.`);
                            resolve(); 
                        }).catch(err => {
                            console.error(err);
                            resolve(); 
                        });
                    } catch (e) { 
                        console.error("Erro Z-API:", e); 
                        resolve(); 
                    }
                }, delayEscolhido * 1000);
            });
        }

        function resetDisplay() {
            document.getElementById('display').innerHTML = `<p class="fs-5 fw-bold mt-3">Posicione o rosto na moldura</p>`;
            isProcessing = false;
        }
    </script>
</body>
</html>
