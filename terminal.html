<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcessaEdu | Terminal de Frequência</title>
    
    <link rel="icon" type="image/png" href="Icone_acessaedu.ico">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --pe-blue: #003399; --pe-yellow: #ffcc00; --pe-green: #10b981; --pe-red: #cc0000; }
        body { background: linear-gradient(135deg, var(--pe-blue) 0%, #001a4d 100%); color: white; font-family: 'Poppins', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; }
        .terminal-container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border-radius: 40px; padding: 40px; border: 1px solid rgba(255, 255, 255, 0.2); width: 95%; max-width: 700px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.3); position: relative; }
        .video-wrapper { position: relative; width: 100%; border-radius: 25px; overflow: hidden; border: 5px solid white; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        video { width: 100%; transform: scaleX(-1); background: #000; display: block; }
        .face-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 10; }
        .face-cutout { width: 250px; height: 320px; border: 4px dashed rgba(255, 255, 255, 0.5); border-radius: 120px; box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5); position: relative; transition: 0.3s; }
        .face-cutout.detected { border-color: var(--pe-green); border-style: solid; box-shadow: 0 0 0 1000px rgba(16, 185, 129, 0.2); }
        .scan-line { position: absolute; width: 100%; height: 4px; background: rgba(255, 255, 255, 0.5); top: 0; animation: scanning 3s linear infinite; }
        @keyframes scanning { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
        .feedback-area { margin-top: 20px; min-height: 120px; }
        .card-aluno { background: var(--pe-green); color: white; padding: 15px; border-radius: 20px; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card-bloqueio { background: var(--pe-red); color: white; padding: 15px; border-radius: 20px; animation: shake 0.5s ease-in-out; }
        .btn-voltar { position: fixed; top: 20px; left: 20px; background: rgba(255,255,255,0.2); color: white; border-radius: 30px; padding: 8px 20px; text-decoration: none; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.3); z-index: 100; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; scale(1); } }
    </style>
</head>
<body>

    <a href="dashboard.html" class="btn-voltar"><i class="fas fa-arrow-left me-2"></i> Voltar</a>

    <div class="terminal-container">
        <div class="logo-terminal mb-3"><img src="logo_acessaedu.png" alt="AcessaEdu" style="max-height: 60px;"></div>
        <div class="video-wrapper">
            <video id="video" autoplay muted playsinline></video>
            <div class="face-overlay">
                <div class="face-cutout" id="moldura"><div class="scan-line"></div></div>
            </div>
        </div>
        <div class="feedback-area" id="display">
            <p class="fs-5 fw-bold mt-3" id="instrucao">Posicione o rosto na moldura</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, getDoc, doc, addDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyDgR98RtL8sgxVbEV2Swyb2wnHLSPt3cDo", authDomain: "escolapro-15e5e.firebaseapp.com", projectId: "escolapro-15e5e", storageBucket: "escolapro-15e5e.firebasestorage.app", messagingSenderId: "339019791514", appId: "1:339019791514:web:44e0d58b6835f0fe6df323" };
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const logado = JSON.parse(localStorage.getItem('usuarioLogado'));
        let ultimoNomeDetectado = ""; 
        let tempoUltimaDeteccao = 0;
        let isProcessing = false;
        let configEscola = null;

        onAuthStateChanged(auth, (user) => {
            if (user) carregarConfiguracoes();
            else window.location.href = 'index.html';
        });

        async function carregarConfiguracoes() {
            if(!logado) return;
            try {
                const docRef = doc(db, "unidades", logado.escolaId);
                const snap = await getDoc(docRef);
                if(snap.exists()) {
                    configEscola = snap.data();
                    initTerminal();
                }
            } catch (e) { console.error(e); }
        }

        async function initTerminal() {
            try {
                const URL_MODELS = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
                await faceapi.nets.tinyFaceDetector.loadFromUri(URL_MODELS);
                await faceapi.nets.faceLandmark68Net.loadFromUri(URL_MODELS);
                await faceapi.nets.faceRecognitionNet.loadFromUri(URL_MODELS);
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('video').srcObject = stream;
                const snap = await getDocs(query(collection(db, "alunos"), where("escolaId", "==", logado.escolaId)));
                const mapaAlunos = {};
                const labledDescriptors = [];
                snap.forEach(d => {
                    const data = d.data();
                    if(data.descritor) {
                        mapaAlunos[data.nome] = { sala: data.sala || "Sem Turma", telResp: data.tel || "" };
                        labledDescriptors.push(new faceapi.LabeledFaceDescriptors(data.nome, [new Float32Array(data.descritor)]));
                    }
                });
                const faceMatcher = new faceapi.FaceMatcher(labledDescriptors, 0.60); 
                setInterval(async () => {
                    if(isProcessing) return;
                    const video = document.getElementById('video');
                    const molduraEl = document.getElementById('moldura');
                    const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                    if(detection) {
                        const box = detection.detection.box;
                        const vW = video.videoWidth; const vH = video.videoHeight;
                        const faceCenterX = box.x + (box.width / 2);
                        const faceCenterY = box.y + (box.height / 2);
                        const enquadradoH = faceCenterX > (vW * 0.35) && faceCenterX < (vW * 0.65);
                        const enquadradoV = faceCenterY > (vH * 0.30) && faceCenterY < (vH * 0.70);
                        const tamanhoCerto = box.height > (vH * 0.40);
                        if (enquadradoH && enquadradoV && tamanhoCerto) {
                            molduraEl.classList.add('detected');
                            const match = faceMatcher.findBestMatch(detection.descriptor);
                            if(match.label !== 'unknown') {
                                const nome = match.label;
                                const agora = Date.now();
                                if(nome === ultimoNomeDetectado && (agora - tempoUltimaDeteccao) < 30000) return;
                                isProcessing = true;
                                processarPresenca(nome, mapaAlunos[nome]);
                            }
                        } else { molduraEl.classList.remove('detected'); }
                    } else { molduraEl.classList.remove('detected'); }
                }, 600);
            } catch (err) { console.error(err); }
        }

        async function processarPresenca(nome, info) {
            const hoje = new Date().toLocaleDateString('pt-BR');
            const hora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            const q = query(collection(db, "frequencia"), where("nome", "==", nome), where("data", "==", hoje), where("escolaId", "==", logado.escolaId));
            const snap = await getDocs(q);
            if (!snap.empty) {
                document.getElementById('display').innerHTML = `<div class="card-bloqueio"><h2>JÁ REGISTRADO</h2><p>${nome.toUpperCase()}</p></div>`;
            } else {
                document.getElementById('display').innerHTML = `<div class="card-aluno"><h2>BEM-VINDO(A)</h2><p>${nome.toUpperCase()}</p></div>`;
                await addDoc(collection(db, "frequencia"), { nome, sala: info.sala, escolaId: logado.escolaId, data: hoje, hora, dataHora: serverTimestamp() });
                if (configEscola.mensagensAtivas && info.telResp) {
                    enviarZapiImediato(info.telResp, nome, hora);
                }
            }
            ultimoNomeDetectado = nome; tempoUltimaDeteccao = Date.now();
            setTimeout(resetDisplay, 3000);
        }

        async function enviarZapiImediato(telefone, alunoNome, hora) {
            if (!configEscola.zapiApi || !configEscola.zapiInstance) return;

            // --- VARIÁVEIS PARA AS MENSAGENS ---
            const nomeU = alunoNome.toUpperCase();
            const escolaU = configEscola.nome.toUpperCase();
            const dataH = new Date().toLocaleDateString('pt-BR');
            const hash = Math.random().toString(36).substring(7).toUpperCase();

            // --- LISTAS PARA ALEATORIEDADE (SPINTAX) ---
            const saudações = ["Olá!", "Bom dia!", "Tudo bem?", "Oi!", "Olá, tudo certo?", "Saudações!", "Atenção Responsáveis:"];
            const corpos = [
                `registro de presença realizado para *${nomeU}* na escola *${escolaU}*.`,
                `informamos que o(a) aluno(a) *${nomeU}* já está na instituição *${escolaU}*.`,
                `confirmamos que *${nomeU}* registrou entrada na unidade *${escolaU}*.`,
                `notificamos a chegada de *${nomeU}* para as atividades na escola *${escolaU}*.`,
                `comunicamos que o(a) estudante *${nomeU}* iniciou o período letivo em *${escolaU}*.`
            ];
            const interacoes = [
                "Por favor, responda com um *'OK'*.",
                "Pode nos dar um retorno com um *'SIM'* por favor?",
                "Responda com um *'OK'* para confirmarmos o recebimento.",
                "Tudo certo com o horário? Responda com um *'OK'*.",
                "Poderia nos confirmar o recebimento com um *'RECEBIDO'*?",
                "Dê um retorno com *'TUDO CERTO'* para validação do sistema."
            ];
            const rodapes = [
                "🤝 Escola e família conectadas.",
                "📌 Salve nosso número oficial na sua agenda.",
                "💡 Adicione este contato para evitar que as mensagens caiam no spam.",
                "✅ Notificação automática gerada pelo sistema AcessaEdu.",
                "🏫 Segurança e controle escolar avançando sempre com você."
            ];

            // --- ESCOLHA ALEATÓRIA ---
            const s = saudações[Math.floor(Math.random() * saudações.length)];
            const c = corpos[Math.floor(Math.random() * corpos.length)];
            const i = interacoes[Math.floor(Math.random() * interacoes.length)];
            const r = rodapes[Math.floor(Math.random() * rodapes.length)];

            // --- MONTAGEM DA MENSAGEM FINAL ---
            const msgFinal = `*AcessaEdu | Notificação* 🏫\n\n` +
                             `${s} ${c}\n\n` +
                             `📅 Data: ${dataH}\n` +
                             `⏰ Hora: ${hora}\n\n` +
                             `${i}\n\n` +
                             `${r}\n` +
                             `_Reg: ${hash}_`;

            // --- TRATAMENTO DO NÚMERO ---
            let num = "55" + telefone.replace(/\D/g, '').replace(/^55/, '');
            if (num.length === 13) num = num.substring(0, 4) + num.substring(5);

            // --- 15 TEMPOS ALEATÓRIOS (DELAY E TYPING) ---
            const dZ = [6, 12, 18, 25, 8, 14, 20, 7, 28, 32, 5, 15, 23, 11, 19];
            const tZ = [3, 5, 7, 4, 6, 3, 8, 5, 4, 6, 3, 7, 5, 4, 6];
            const randomDelay = dZ[Math.floor(Math.random() * dZ.length)];
            const randomTyping = tZ[Math.floor(Math.random() * tZ.length)];

            try {
                let baseUrl = configEscola.zapiApi.trim().split('/instances')[0].replace(/\/+$/, "");
                const endpoint = `${baseUrl}/instances/${configEscola.zapiInstance}/token/${configEscola.zapiToken}/send-text`;
                const headers = { 'Content-Type': 'application/json' };
                if (configEscola.zapiSecurity) headers['Client-Token'] = configEscola.zapiSecurity;

                // DISPARA PARA A Z-API
                fetch(endpoint, { 
                    method: 'POST', 
                    headers: headers, 
                    body: JSON.stringify({ 
                        phone: num, 
                        message: msgFinal, 
                        delayMessage: randomDelay, 
                        delayTyping: randomTyping 
                    }) 
                });
            } catch (e) { console.error("Erro no disparo Z-API:", e); }
        }

        function resetDisplay() {
            document.getElementById('display').innerHTML = `<p class="fs-5 fw-bold mt-3">Posicione o rosto na moldura</p>`;
            isProcessing = false;
        }
    </script>
</body>
</html>
