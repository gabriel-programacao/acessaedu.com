<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcessaEdu | Terminal de Frequência</title>
    
    <link rel="icon" type="image/png" href="Icone_acessaedu.ico">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --pe-blue: #003399; --pe-yellow: #ffcc00; --pe-green: #10b981; --pe-red: #cc0000; }
        body { background: linear-gradient(135deg, var(--pe-blue) 0%, #001a4d 100%); color: white; font-family: 'Poppins', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; }
        .terminal-container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border-radius: 40px; padding: 40px; border: 1px solid rgba(255, 255, 255, 0.2); width: 95%; max-width: 700px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.3); position: relative; }
        .video-wrapper { position: relative; width: 100%; border-radius: 25px; overflow: hidden; border: 5px solid white; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        video { width: 100%; transform: scaleX(-1); background: #000; display: block; }
        .face-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 10; }
        .face-cutout { width: 250px; height: 320px; border: 4px dashed rgba(255, 255, 255, 0.5); border-radius: 120px; box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5); position: relative; transition: 0.3s; }
        .face-cutout.detected { border-color: var(--pe-green); border-style: solid; box-shadow: 0 0 0 1000px rgba(16, 185, 129, 0.2); }
        .scan-line { position: absolute; width: 100%; height: 4px; background: rgba(255, 255, 255, 0.5); top: 0; animation: scanning 3s linear infinite; }
        @keyframes scanning { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
        .feedback-area { margin-top: 20px; min-height: 120px; }
        .card-aluno { background: var(--pe-green); color: white; padding: 15px; border-radius: 20px; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card-atraso { background: var(--pe-yellow); color: var(--pe-blue); padding: 15px; border-radius: 20px; animation: popIn 0.5s ease; }
        .card-bloqueio { background: var(--pe-red); color: white; padding: 15px; border-radius: 20px; animation: shake 0.5s ease-in-out; }
        .btn-voltar { position: fixed; top: 20px; left: 20px; background: rgba(255,255,255,0.2); color: white; border-radius: 30px; padding: 8px 20px; text-decoration: none; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.3); z-index: 100; }
        
        /* Estilo do novo Badge indicador de Fila adicionado no topo direito */
        .badge-fila { position: absolute; top: 20px; right: 20px; background: rgba(0, 0, 0, 0.4); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; border: 1px solid rgba(255, 255, 255, 0.15); font-weight: 500; display: none; backdrop-filter: blur(5px); z-index: 90; }
        
        @keyframes popIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    </style>
</head>
<body>

    <a href="dashboard.html" class="btn-voltar"><i class="fas fa-arrow-left me-2"></i> Voltar</a>

    <div class="terminal-container">
        <div id="statusFila" class="badge-fila"><i class="fas fa-paper-plane me-2 text-warning"></i> Fila de Envios: <span id="contadorFila">0</span></div>
        
        <div class="logo-terminal mb-3"><img src="logo_acessaedu.png" alt="AcessaEdu" style="max-height: 60px;"></div>
        <div class="video-wrapper">
            <video id="video" autoplay muted playsinline></video>
            <div class="face-overlay">
                <div class="face-cutout" id="moldura"><div class="scan-line"></div></div>
            </div>
        </div>
        <div class="feedback-area" id="display">
            <p class="fs-5 fw-bold mt-3" id="instrucao">Posicione o rosto na moldura</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, getDoc, doc, addDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyDgR98RtL8sgxVbEV2Swyb2wnHLSPt3cDo", authDomain: "escolapro-15e5e.firebaseapp.com", projectId: "escolapro-15e5e", storageBucket: "escolapro-15e5e.firebasestorage.app", messagingSenderId: "339019791514", appId: "1:339019791514:web:44e0d58b6835f0fe6df323" };
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const logado = JSON.parse(localStorage.getItem('usuarioLogado'));
        let ultimoNomeDetectado = ""; 
        let tempoUltimaDeteccao = 0;
        let isProcessing = false;
        let configEscola = null;
        let ultimoDelayUtilizado = null;

        let contadorEstabilidade = 0;
        let labelTemporariaAnterior = "";

        const filaDeMensagens = [];
        let filaProcessando = false;

        onAuthStateChanged(auth, (user) => {
            if (user) carregarConfiguracoes();
            else window.location.href = 'index.html';
        });

        async function carregarConfiguracoes() {
            if(!logado) return;
            try {
                const docRef = doc(db, "unidades", logado.escolaId);
                const snap = await getDoc(docRef);
                if(snap.exists()) {
                    configEscola = snap.data();
                    initTerminal();
                }
            } catch (e) { console.error(e); }
        }

        async function initTerminal() {
            try {
                const URL_MODELS = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
                await faceapi.nets.ssdMobilenetv1.loadFromUri(URL_MODELS);
                await faceapi.nets.tinyFaceDetector.loadFromUri(URL_MODELS);
                await faceapi.nets.faceLandmark68Net.loadFromUri(URL_MODELS);
                await faceapi.nets.faceRecognitionNet.loadFromUri(URL_MODELS);
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('video').srcObject = stream;
                
                const snap = await getDocs(query(collection(db, "alunos"), where("escolaId", "==", logado.escolaId)));
                const mapaAlunos = {};
                const labledDescriptors = [];
                
                snap.forEach(d => {
                    const data = d.data();
                    if(data.descritor) {
                        mapaAlunos[data.nome] = { sala: data.sala || "Sem Turma", telResp: data.tel || "" };
                        labledDescriptors.push(new faceapi.LabeledFaceDescriptors(data.nome, [new Float32Array(data.descritor)]));
                    }
                });

                // ALTERADO: Reduzido o rigor sutilmente de 0.38 para 0.42 equilibrando aceitação biométrica e proteção
                const faceMatcher = new faceapi.FaceMatcher(labledDescriptors, 0.42); 

                setInterval(async () => {
                    if(isProcessing) return;
                    const video = document.getElementById('video');
                    const molduraEl = document.getElementById('moldura');
                    
                    const detection = await faceapi.detectSingleFace(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.75 })).withFaceLandmarks().withFaceDescriptor();
                    
                    if(detection) {
                        const box = detection.detection.box;
                        const vW = video.videoWidth; 
                        const vH = video.videoHeight;
                        const faceCenterX = box.x + (box.width / 2);
                        const faceCenterY = box.y + (box.height / 2);
                        
                        const enquadradoH = faceCenterX > (vW * 0.25) && faceCenterX < (vW * 0.75);
                        const enquadradoV = faceCenterY > (vH * 0.20) && faceCenterY < (vH * 0.80);
                        const tamanhoCerto = box.height > (vH * 0.38);

                        if (enquadradoH && enquadradoV && tamanhoCerto) {
                            molduraEl.classList.add('detected');
                            const match = faceMatcher.findBestMatch(detection.descriptor);
                            
                            if(match.label !== 'unknown') {
                                const nome = match.label;
                                
                                if (nome === labelTemporariaAnterior) {
                                    contadorEstabilidade++;
                                    
                                    document.getElementById('display').innerHTML = `<p class="fs-5 fw-bold mt-3 text-warning">Analisando... Fique parado (${Math.round((contadorEstabilidade / 5) * 100)}%)</p>`;
                                    
                                    if (contadorEstabilidade >= 5) {
                                        const agora = Date.now();
                                        if(nome === ultimoNomeDetectado && (agora - tempoUltimaDeteccao) < 30000) {
                                            contadorEstabilidade = 0;
                                            document.getElementById('display').innerHTML = `<p class="fs-5 fw-bold mt-3">Posicione o rosto na moldura</p>`;
                                            return;
                                        }
                                        isProcessing = true;
                                        processarPresenca(nome, mapaAlunos[nome]);
                                        contadorEstabilidade = 0;
                                    }
                                } else {
                                    contadorEstabilidade = 0;
                                    labelTemporariaAnterior = nome;
                                }
                            } else {
                                contadorEstabilidade = 0;
                                labelTemporariaAnterior = "";
                                isProcessing = true;
                                exibirNaoCadastrado();
                            }
                        } else { 
                            molduraEl.classList.remove('detected'); 
                            contadorEstabilidade = 0;
                            labelTemporariaAnterior = "";
                        }
                    } else { 
                        molduraEl.classList.remove('detected'); 
                        contadorEstabilidade = 0;
                        labelTemporariaAnterior = "";
                    }
                }, 500);
            } catch (err) { console.error(err); }
        }

        function exibirNaoCadastrado() {
            document.getElementById('display').innerHTML = `
                <div class="card-bloqueio" style="background: #6c757d;">
                    <h2>ALUNO NÃO RECONHECIDO</h2>
                    <p>Aproxime-se e centralize bem o rosto.</p>
                </div>`;
            setTimeout(resetDisplay, 3000);
        }

        async function processarPresenca(nome, info) {
            const agora = new Date();
            const hoje = agora.toLocaleDateString('pt-BR');
            const horaAtual = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            const [h, m] = horaAtual.split(':').map(Number);
            const totalMinutos = (h * 60) + m;
            const estaAtrasado = totalMinutos >= 466;

            const q = query(collection(db, "frequencia"), where("nome", "==", nome), where("data", "==", hoje), where("escolaId", "==", logado.escolaId));
            const snap = await getDocs(q);

            if (!snap.empty) {
                document.getElementById('display').innerHTML = `<div class="card-bloqueio"><h2>JÁ REGISTRADO</h2><p>${nome.toUpperCase()}</p></div>`;
            } else {
                await addDoc(collection(db, "frequencia"), { 
                    nome, sala: info.sala, escolaId: logado.escolaId, data: hoje, hora: horaAtual, dataHora: serverTimestamp(), atraso: estaAtrasado 
                });

                if (estaAtrasado) {
                    document.getElementById('display').innerHTML = `<div class="card-atraso"><h2>ENTRADA COM ATRASO</h2><p>${nome.toUpperCase()}<br>Horário: ${horaAtual}</p></div>`;
                    if (configEscola.mensagensAtActive || configEscola.mensagensAtivas) {
                        if (info.telResp) {
                            filaDeMensagens.push({ telefone: info.telResp, alunoNome: nome, hora: horaAtual });
                            
                            // ACRESCENTADO: Atualiza e exibe o contador na tela sempre que entra uma nova mensagem
                            atualizarPainelFila();
                            
                            processarProximaDaFila(); 
                        }
                    }
                } else {
                    document.getElementById('display').innerHTML = `<div class="card-aluno"><h2>BEM-VINDO(A)</h2><p>${nome.toUpperCase()}</p></div>`;
                }
            }
            ultimoNomeDetectado = nome; 
            tempoUltimaDeteccao = Date.now();
            setTimeout(resetDisplay, 3000);
        }

        // ACRESCENTADO: Função interna auxiliar para gerenciar a visibilidade do painel numérico de contagem
        function atualizarPainelFila() {
            const painel = document.getElementById('statusFila');
            const contador = document.getElementById('contadorFila');
            const total = filaDeMensagens.length;

            if (total > 0 || filaProcessando) {
                // Soma 1 no contador de tarefas pendentes caso o processo de envio atual esteja ativo
                const exibicaoTotal = total + (filaProcessando ? 1 : 0);
                contador.innerText = exibicaoTotal;
                painel.style.display = "block";
            } else {
                painel.style.display = "none";
            }
        }

        async function processarProximaDaFila() {
            if (filaProcessando || filaDeMensagens.length === 0) return;
            filaProcessando = true;

            const tarefaAtual = filaDeMensagens.shift();
            
            // Atualiza o painel quando a mensagem sai da fila e entra em processamento ativo
            atualizarPainelFila();

            await executarEnvioZapi(tarefaAtual.telefone, tarefaAtual.alunoNome, tarefaAtual.hora);

            filaProcessando = false;
            
            // Atualiza novamente após a conclusão do envio
            atualizarPainelFila();
            
            processarProximaDaFila(); 
        }

        function executarEnvioZapi(telefone, alunoNome, hora) {
            return new Promise(async (resolve) => {
                if (!configEscola.zapiApi || !configEscola.zapiInstance || !configEscola.zapiToken) {
                    resolve();
                    return;
                }

                const nomeU = alunoNome.toUpperCase();
                const schoolRaw = configEscola.nome || logado.escolaId;
                const escoU = schoolRaw.toUpperCase();
                const dataHoje = new Date().toLocaleDateString('pt-BR');
                const registroId = Math.random().toString(36).substring(7).toUpperCase();

                const saudacoes = [
                    "AcessaEdu | Alerta de Entrada Tardia",
                    "⚠️ NOTIFICAÇÃO IMPORTANTE - PONTUALIDADE",
                    "🏫 Informativo de Frequência - " + escoU + "",
                    "🔔 COMUNICADO DE ENTRADA NA ESCOLA",
                    "📍 AcessaEdu | Controle de Acesso",
                    "👋 Olá, Bom Dia | Comunicado de Entrada Escolar!",
                    "📚 *AcessaEdu | Acompanhamento Escolar*",
                    "🚸 *Alerta de Frequência Escolar*",
                    "📢 *Comunicado Automático de Presença*",
                    "🏫 *Monitoramento de Entrada - " + escoU + "*",
                    "🌞 *Bom Dia! Atualização de Frequência Escolar*",
                    "📋 *Registro de Frequência Escolar*",
                    "⏰ *Alerta de Horário de Entrada*",
                    "🎓 *Comunicado aos Responsáveis*",
                    "📲 *AcessaEdu | Notificação de Acesso*",
                    "🚪 *Controle de Entrada Escolar*"
                ];

                const corpos = [
                    `Prezados responsáveis, comunicamos que o(a) aluno(a) *${nomeU}* deu entrada na unidade *${escoU}* apresentando atraso em relação ao horário oficial.\n\n📅 Data: ${dataHoje}\n⏰ Horário Registrado: ${hora}`,
                    `Informamos que registramos em nosso sistema a entrada do(a) estudante *${nomeU}* após o horário regulamentar de início das aulas.\n\n📅 Dia: ${dataHoje}\n⌚ Entrada às: ${hora}`,
                    `Notificamos que o(a) aluno(a) *${nomeU}* apresentou-se hoje na instituição com atraso verificado pela nossa portaria digital.\n\n🏫 Unidade: *${escoU}*\n⏰ Horário de Chegada: ${hora}`,
                    `Aviso Pedagógico: Identificamos que *${nomeU}* ultrapassou a tolerância permitida para a entrada letiva na data de hoje.\n\n📅 Data do registro: ${dataHoje}\n⌚ Horário exato: ${hora}`,
                    `Prezados responsáveis, o sistema registrou a entrada do(a) estudante *${nomeU}* após o horário previsto para início das atividades escolares.\n\n📅 Data: ${dataHoje}\n⏰ Horário registrado: ${hora}`,
                    `Comunicamos que o(a) aluno(a) *${nomeU}* acessou as dependências da escola in horário posterior ao estabelecido para entrada.\n\n🏫 Unidade: *${escoU}*\n⌚ Horário de acesso: ${hora}`,
                    `Nosso controle de acesso identificou que *${nomeU}* realizou o registro de entrada com atraso nesta data.\n\n📅 Registro: ${dataHoje}\n⏰ Entrada efetuada às: ${hora}`,
                    `Informação importante aos responsáveis: o(a) estudante *${nomeU}* chegou à unidade escolar após o início regular das aulas.\n\n🏫 Escola: *${escoU}*\n⌚ Horário de chegada: ${hora}`,
                    `Através do sistema de monitoramento escolar, registramos a entrada tardia de *${nomeU}* nesta data.\n\n📅 Data: ${dataHoje}\n⏰ Horário confirmed: ${hora}`,
                    `Registramos em nossa plataforma que o(a) aluno(a) *${nomeU}* ingressou na unidade escolar após o horário habitual de início das atividades.\n\n📅 Data: ${dataHoje}\n⏰ Entrada registrada: ${hora}`,
                    `Comunicado automático: foi identificada a chegada de *${nomeU}* in horário posterior ao previsto para o início das aulas.\n\n🏫 Unidade: *${escoU}*\n⌚ Horário: ${hora}`,
                    `O sistema AcessaEdu registrou a entrada de *${nomeU}* com atraso nesta data.\n\n📅 ${dataHoje}\n⏰ Horário de acesso: ${hora}`,
                    `Informamos aos responsáveis que *${nomeU}* teve sua presença registrada após o horário regular de entrada da instituição.\n\n🏫 Escola: *${escoU}*\n⌚ Registro: ${hora}`,
                    `Notificação de frequência: a entrada do(a) estudante *${nomeU}* ocorreu fora do horário previsto para início das atividades escolares.\n\n📅 Data: ${dataHoje}\n⏰ Horário registrado: ${hora}`
                ];

                const fechamentos = [
                    "⚠️ ATENÇÃO: Salve nosso número na sua agenda para continuar recebendo os relatórios diários de frequência e responda esta mensagem com 'CIENTE'.",
                    "💡 *IMPORTANTE:* Para evitar que o WhatsApp bloqueie nossos envios automáticos, *salve este contato* nos seus favoritos e responda com um *'OK'*.",
                    "📝 Pedimos que *salve este número oficial da escola* nos seus contatos e confirme o recebimento respondendo apenas *'RECEBIDO'*.",
                    "🔒 Mantenha este canal ativo! *Adicione nosso número à sua lista de contatos* e valide esta notificação respondendo com *'VERIFICADO'*.",
                    "✅ Para garantir o recebimento contínuo das notificações escolares, adicione este número aos seus contatos e responda com *'CIENTE'*.",
                    "📲 Salve este contato como canal oficial da escola e confirme esta comunicação respondendo com *'OK RECEBIDO'*.",
                    "🔔 Este número é utilizado para avisos importantes sobre frequência e acesso escolar. Salve-o e responda com *'CONFIRMADO'*.",
                    "📌 Recomendamos adicionar este contato à sua agenda para evitar perda de futuras notificações. Responda com *'RECEBIDO'* para validar o canal.",
                    "🤝 Sua confirmação é importante. Salve este número em seus contatos e responda com *'CIENTE E RECEBIDO'* para concluir o cadastro deste canal.",
                    "📢 Para continuar recebendo comunicados automáticos da escola, adicione este número aos seus contatos e responda com *'OK'*.",
                    "✅ Confirme o recebimento desta notificação respondendo *'CIENTE'* and mantenha este número salvo em sua agenda.",
                    "📱 Salve este contato para receber futuras informações acadêmicas e responda com *'CONFIRMADO'*.",
                    "🔐 Este é um canal oficial de comunicação escolar. Adicione-o à sua agenda e responda com *'RECEBIDO E CIENTE'*.",
                    "📬 Ajude-nos a manter a comunicação active: salve este número e responda com *'VERIFICADO'* para confirmar o recebimento."
                ];

                const s = saudacoes[Math.floor(Math.random() * saudacoes.length)];
                const c = corpos[Math.floor(Math.random() * corpos.length)];
                const f = fechamentos[Math.floor(Math.random() * fechamentos.length)];
                
                const msgFinal = `${s}\n\n${c}\n\n${f}\n\n*${escoU}* sempre avançando, sempre junto!\n_Busca ativa junto da família._\n\n✅ Notificação AcessaEdu\n_Ref: ${registroId}_`;

                const temposAleatorios = [45, 10, 29, 43, 14, 76, 87, 80, 89, 42, 78, 97, 44, 32, 21, 31, 56, 10, 20, 22, 25, 18, 45, 70, 98, 12, 86, 60, 75, 90, 105, 100, 180];
                let delayEscolhido;
                
                do {
                    delayEscolhido = temposAleatorios[Math.floor(Math.random() * temposAleatorios.length)];
                } while (delayEscolhido === ultimoDelayUtilizado);
                
                ultimoDelayUtilizado = delayEscolhido; 

                let num = "55" + telefone.replace(/\D/g, '').replace(/^55/, '');
                if (num.length === 13) num = num.substring(0, 4) + num.substring(5);

                console.log(`Fila Sequencial | Iniciando contagem de delay isolado para ${nomeU}: ${delayEscolhido} segundos...`);
                
                setTimeout(() => {
                    try {
                        let baseUrl = configEscola.zapiApi.trim();
                        if(baseUrl.includes('/instances/')) { baseUrl = baseUrl.split('/instances/')[0]; }
                        baseUrl = baseUrl.replace(/\/+$/, "");
                        const endpoint = `${baseUrl}/instances/${configEscola.zapiInstance}/token/${configEscola.zapiToken}/send-text`;
                        
                        fetch(endpoint, { 
                            method: 'POST', 
                            headers: { 'Content-Type': 'application/json', ...(configEscola.zapiSecurity && { 'Client-Token': configEscola.zapiSecurity }) }, 
                            body: JSON.stringify({ phone: num, message: msgFinal, delayMessage: 0, delayTyping: 8 }) 
                        }).then(r => {
                            console.log(`Fila Sequencial | Envio Realizado: ${registroId} do aluno ${nomeU}. Próximo da fila liberado.`);
                            resolve(); 
                        }).catch(err => {
                            console.error(err);
                            resolve(); 
                        });
                    } catch (e) { 
                        console.error("Erro Z-API:", e); 
                        resolve(); 
                    }
                }, delayEscolhido * 1000);
            });
        }

        function resetDisplay() {
            document.getElementById('display').innerHTML = `<p class="fs-5 fw-bold mt-3">Posicione o rosto na moldura</p>`;
            isProcessing = false;
        }
    </script>
</body>
</html>
